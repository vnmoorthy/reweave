[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reweave"
version = "0.3.0"
description = "Self-healing web data pipelines. An autonomous repair agent for scrapers that breaks the maintenance treadmill — with a human approval gate in front of every deploy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reweave contributors" }]
keywords = ["agents", "web-scraping", "self-healing", "mcp", "trueforge", "brightdata", "data-pipelines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.4"]

[project.scripts]
reweave = "reweave.cli:main"

[project.urls]
Homepage = "https://vnmoorthy.github.io/reweave/"
Repository = "https://github.com/vnmoorthy/reweave"

[tool.setuptools.packages.find]
include = ["reweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI's `Body(...)` in defaults is idiomatic
    "E501",  # long strings in evidence/log messages are deliberate
]
