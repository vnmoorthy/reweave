[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reweave"
version = "0.1.0"
description = "Self-healing web data pipelines. An autonomous repair agent for scrapers that breaks the maintenance treadmill — with a human approval gate in front of every deploy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reweave contributors" }]
keywords = ["agents", "web-scraping", "self-healing", "mcp", "trueforge", "brightdata", "data-pipelines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reweave = "reweave.cli:main"

[project.urls]
Homepage = "https://vnmoorthy.github.io/reweave/"
Repository = "https://github.com/vnmoorthy/reweave"

[tool.setuptools.packages.find]
include = ["reweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
